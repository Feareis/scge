; Copy this file to config.ini and adapt it; config.ini is local (not versioned).
; Without config.ini, the pipeline reads this file. Relative paths start from GAME_EXTRACT.

[game]
; Star Citizen install folder, the one that contains LIVE/, PTU/... (read only, never written)
dir = C:\Program Files\Roberts Space Industries\StarCitizen
; Game channel to extract: LIVE, PTU, EPTU...
channel = LIVE

[tools]
; starbreaker CLI 0.3.2: reads Data.p4k and exports the DataCore
starbreaker = tools/starbreaker-cli-v0.3.2-windows-x86_64/starbreaker.exe
; unp4k 4.0.87: fallback for files starbreaker failed to extract (optional on disk)
unp4k = tools/unp4k-suite-win-x64-v4.0.87/publish/unp4k.exe

[output]
; Phase 1: raw files copied out of Data.p4k, one folder per <channel>/<build>
extraction = raw_extraction
; Phase 2: JSON exports and normalized lists, one folder per <build>
data_json = data_json
